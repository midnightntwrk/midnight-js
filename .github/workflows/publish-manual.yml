name: Publish (manual)
#
# Workaround to publish the current `main` on demand, WITHOUT a version-bump
# commit and WITHOUT re-running CI/e2e. Instead it requires the test evidence of
# this commit's completed ci.yml push run and attaches it to the release.
#
# It publishes the version currently in the root package.json AS-IS — e.g. to
# finish a release whose automatic publish never completed (CI timed out
# mid-run), or to publish main ahead of the last release.
#
# HEAD must be a commit whose ci.yml push run ran every test lane. A commit the
# path filter skips (docs only, for example) has no evidence, so this refuses it.
#
# Already-published artefacts are never touched: publish-packages.mjs skips
# every package/registry that already has this version, so a run on a fully
# published version publishes nothing. Re-running the failed ci.yml publish job
# finishes a partial release the same way.
#
# It reads the ci.yml run of this commit but does not change the automatic release path.

env:
  MIDNIGHTCI_PACKAGES_WRITE: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write
  packages: write

concurrency:
  group: publish-manual
  cancel-in-progress: false

jobs:
  publish:
    name: Publish current main
    runs-on: ubuntu-latest
    environment: npm-publish-stable
    steps:
      - name: Guard - main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::publish-manual can only run from main (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          node-auth-token: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          turbo-cache: 'false'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Find the CI run of this commit
        id: ci_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run_id=$(gh run list -R "$REPO" -w ci.yml -e push -c "$SHA" -s completed -L 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No completed ci.yml push run for ${SHA}. Wait for CI on main to finish, then run this workflow again."
            exit 1
          fi
          echo "Using test evidence from ci.yml run ${run_id}."
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      # Before the first publish: a release with missing or failed evidence must stop here.
      # Artifacts and logs expire with the repository's retention period, so an older
      # commit cannot be published this way.
      - name: Collect test evidence
        id: evidence
        uses: ./.github/actions/collect-test-evidence
        with:
          run-id: ${{ steps.ci_run.outputs.run_id }}
          version: ${{ steps.guard.outputs.version }}
          sha: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build packages
        run: yarn build:core
        env:
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Extract release notes
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # CHANGELOG headers use bare versions in brackets ("## [4.1.0]").
          # Extract the section between this version's header and the next "## ".
          awk -v ver="$VERSION_NUMBER" '
            $0 ~ ("^## \\[" ver "\\]") { found=1; next }
            found && /^## / { exit }
            found
          ' CHANGELOG.md > release_notes.md
          # Fall back to a minimal body when CHANGELOG has no section for this version.
          if [ ! -s release_notes.md ]; then
            echo "Manual release of v${VERSION_NUMBER} from main @ $(git rev-parse --short HEAD)." > release_notes.md
          fi

      - name: Link test evidence in release notes
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.ci_run.outputs.run_id }}
          SUMMARY: ${{ steps.evidence.outputs.summary }}
        run: printf "\n**Test evidence:** \`%s\` and the tarball attached to this release (CI run %s).\n" "$SUMMARY" "$RUN_URL" >> release_notes.md

      - name: Validate packages before publishing
        uses: ./.github/actions/validate-packages
        with:
          workspace-path: './packages'

      - name: Publish packages
        run: node .github/scripts/publish-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          MIDNIGHT_WORKSPACE_DIR: 'packages'
          MIDNIGHT_PUBLISH_DRY_RUN: ${{ vars.NPM_PUBLISH_DRY_RUN == 'true' }}

      - name: Bump testkit-js versions
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.version }}
        run: yarn workspaces foreach -R --from "./testkit-js/*" --exclude "./packages/*" version "$VERSION_NUMBER"

      - name: Build testkit-js packages
        run: yarn build:testkit
        env:
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Validate testkit-js packages before publishing
        uses: ./.github/actions/validate-packages
        with:
          workspace-path: './testkit-js'

      - name: Publish testkit-js packages
        run: node .github/scripts/publish-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          MIDNIGHT_WORKSPACE_DIR: 'testkit-js'
          MIDNIGHT_PUBLISH_DRY_RUN: ${{ vars.NPM_PUBLISH_DRY_RUN == 'true' }}

      - name: Check for an existing GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists - leaving it untouched."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: vars.NPM_PUBLISH_DRY_RUN != 'true' && steps.release.outputs.exists != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # ratchet:softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          files: |
            ${{ steps.evidence.outputs.bundle }}
            ${{ steps.evidence.outputs.summary }}
          fail_on_unmatched_files: true
          draft: false
          # A version with a pre-release identifier (e.g. 5.0.0-beta.1) is flagged
          # as a pre-release and must NOT become the "Latest" release.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          make_latest: ${{ contains(steps.version.outputs.version, '-') && 'false' || 'true' }}
