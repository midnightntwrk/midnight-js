name: Publish (manual)
#
# Workaround to publish the current `main` on demand, WITHOUT a version-bump
# commit and WITHOUT the full CI/e2e cycle (main is assumed already tested).
#
# It publishes the version currently in the root package.json AS-IS — e.g. to
# finish a release whose automatic publish never completed (CI timed out
# mid-run), or to publish main ahead of the last release.
#
# Already-published artefacts are never touched: publish-packages.mjs skips
# every package/registry that already has this version, so a run on a fully
# published version publishes nothing. Re-running the failed ci.yml publish job
# finishes a partial release the same way.
#
# This does NOT touch ci.yml or the automatic release path. See
# docs/superpowers/specs/2026-07-08-manual-publish-from-main-design.md.

env:
  MIDNIGHTCI_PACKAGES_WRITE: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: publish-manual
  cancel-in-progress: false

jobs:
  publish:
    name: Publish current main
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Guard - main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::publish-manual can only run from main (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          node-auth-token: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Build packages
        run: yarn build:core
        env:
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Extract release notes
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # CHANGELOG headers use bare versions in brackets ("## [4.1.0]").
          # Extract the section between this version's header and the next "## ".
          awk -v ver="$VERSION_NUMBER" '
            $0 ~ ("^## \\[" ver "\\]") { found=1; next }
            found && /^## / { exit }
            found
          ' CHANGELOG.md > release_notes.md
          # Fall back to a minimal body when CHANGELOG has no section for this version.
          if [ ! -s release_notes.md ]; then
            echo "Manual release of v${VERSION_NUMBER} from main @ $(git rev-parse --short HEAD)." > release_notes.md
          fi

      - name: Validate packages before publishing
        uses: ./.github/actions/validate-packages
        with:
          workspace-path: './packages'

      - name: Publish packages
        run: node .github/scripts/publish-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          MIDNIGHT_WORKSPACE_DIR: 'packages'
          MIDNIGHT_PUBLISH_DRY_RUN: ${{ vars.NPM_PUBLISH_DRY_RUN || 'false' }}

      - name: Bump testkit-js versions
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.version }}
        run: yarn workspaces foreach -R --from "./testkit-js/*" --exclude "./packages/*" version "$VERSION_NUMBER"

      - name: Build testkit-js packages
        run: yarn build:testkit
        env:
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Validate testkit-js packages before publishing
        uses: ./.github/actions/validate-packages
        with:
          workspace-path: './testkit-js'

      - name: Publish testkit-js packages
        run: node .github/scripts/publish-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          MIDNIGHT_WORKSPACE_DIR: 'testkit-js'
          MIDNIGHT_PUBLISH_DRY_RUN: ${{ vars.NPM_PUBLISH_DRY_RUN || 'false' }}

      - name: Check for an existing GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists - leaving it untouched."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: vars.NPM_PUBLISH_DRY_RUN != 'true' && steps.release.outputs.exists != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # ratchet:softprops/action-gh-release@v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          draft: false
          # A version with a pre-release identifier (e.g. 5.0.0-beta.1) is flagged
          # as a pre-release and must NOT become the "Latest" release.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          make_latest: ${{ contains(steps.version.outputs.version, '-') && 'false' || 'true' }}
