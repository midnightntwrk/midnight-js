name: CI - TestKit.js (e2e)
env:
  MIDNIGHTCI_PACKAGES_WRITE: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

permissions:
  contents: read
  issues: read
  id-token: write
  packages: write
  checks: write
  pull-requests: write

on:
  workflow_call:
    inputs:
      test_files:
        type: string
        description: JSON array of e2e test filenames (output of the build workflow's generate-test-matrix).
        required: true
      testkit_docker_env:
        type: string
        description: Docker image version set sourced from testkit-js/env/<testkit_docker_env>.env (qanet|preview|preprod|mainnet|devnet). Empty falls back to the .envrc default (devnet).
        required: false
        default: 'devnet'
      build_timeout:
        type: number
        required: false
        default: 30
      run_fork_lane:
        type: boolean
        description: Whether to run the fork-crossing lane (fork.*). The fork stack pins its own images and ignores testkit_docker_env, so fanning it out over image sets repeats the same run.
        required: false
        default: true
      network:
        type: string
        description: Midnight network to use (testnet/devnet/undeployed)
        required: true
        default: 'undeployed'

concurrency:
  group: TK-JS-e2e-${{ github.workflow }}-${{ inputs.testkit_docker_env || 'default' }}-${{ github.event.pull_request.number || github.ref }}
  # Only cancel superseded PR runs; queue push-to-main runs so a mid-flight
  # release (gated on this workflow in ci.yml) is never cancelled half-done.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare_images:
    name: Prepare Docker Images
    runs-on: ubuntu-latest
    env:
      TESTKIT_DOCKER_ENV: ${{ inputs.testkit_docker_env }}
    steps:

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Cache Docker images
        id: image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: image-cache
          key: docker-images-zst-${{ inputs.testkit_docker_env }}-${{ hashFiles(format('testkit-js/env/{0}.env', inputs.testkit_docker_env)) }}

      - name: Log in to GitHub Container registry
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4.6.0
        with:
          registry: 'https://ghcr.io'
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      # The steps in e2e_tests key the extra registry logins and the longer job timeout off a
      # `fork.` filename prefix, because the matrix carries filenames and nothing else. Assert the
      # convention here rather than letting a violation surface as an opaque `unauthorized` on a
      # cache hit -- a failure that only appears on some runs and points nowhere near the cause.
      - name: Check fork-stack tests follow the fork.* naming convention
        run: |
          set -euo pipefail
          cd testkit-js/testkit-js-e2e/test
          offenders=$(grep -l 'ForkTestEnvironment' *.test.ts | grep -v '^fork\.' || true)
          if [ -n "$offenders" ]; then
            echo "::error::These tests drive ForkTestEnvironment but are not named fork.*, so they will not get the fork stack's registry logins or job timeout: $offenders"
            exit 1
          fi

      - name: Pull and save images
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          set -a
          . "testkit-js/env/${TESTKIT_DOCKER_ENV}.env"
          set +a
          mkdir -p image-cache
          docker compose -f testkit-js/compose.yml pull
          docker save \
            "ghcr.io/midnight-ntwrk/proof-server:${PROOF_SERVER_VERSION}" \
            "ghcr.io/midnight-ntwrk/indexer-standalone:${INDEXER_VERSION}" \
            "ghcr.io/midnight-ntwrk/midnight-node:${MIDNIGHT_NODE_VERSION}" \
            | zstd -T0 > image-cache/images.tar.zst

  e2e_tests:
    name: E2E Tests
    needs: prepare_images
    runs-on: ubuntu-latest-8-core-x64
    timeout-minutes: ${{ startsWith(matrix.test-file, 'fork.') && 60 || inputs.build_timeout }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        test-file: ${{ fromJson(inputs.test_files) }}
    steps:

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          node-auth-token: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          cache-key-prefix: 'turbo-testkit'
          testkit-docker-env: ${{ inputs.testkit_docker_env }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          name: midnight-js-dist-testkit
          path: packages/

      - name: Download testkit build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          name: testkit-dist
          path: testkit-js/

      - name: Download contracts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          name: e2e-tests-contracts
          path: testkit-js/testkit-js-e2e/src/contract/compiled

      - name: Post-Install dependencies
        run: yarn postinstall

      - name: Restore Docker images
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: image-cache
          key: docker-images-zst-${{ inputs.testkit_docker_env }}-${{ hashFiles(format('testkit-js/env/{0}.env', inputs.testkit_docker_env)) }}

      # ghcr is normally only needed on a cache miss: on a hit the images are
      # loaded from the tarball below and `docker compose up` finds them locally
      # (no pull). Mirrors prepare_images' conditional login and removes a
      # per-matrix-job ghcr round-trip that was prone to `Client.Timeout`.
      #
      # A `fork.` test file is the exception: it stands up its own compose stack
      # (compose-fork.yml) whose images are not in the cached set at all, so on a
      # cache hit it would reach ghcr unauthenticated and fail with
      # `unauthorized`. Only that job pays the extra login.
      - name: Log in to GitHub Container registry
        if: steps.image-cache.outputs.cache-hit != 'true' || startsWith(matrix.test-file, 'fork.')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4.6.0
        with:
          registry: 'https://ghcr.io'
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      # The fork stack's toolkit image is on Docker Hub, not ghcr, so the login above does not
      # authorize it. Anonymous pulls from shared runner IPs hit Docker Hub's rate limit, and the
      # pull happens inside enactFork() -- minutes into the test -- where it looks like a governance
      # failure rather than a registry one.
      #
      # No Docker Hub credentials are configured for this repo today, and an empty login is a hard
      # failure in the action, so this is inert until someone adds them. The anonymous pull that the
      # lane relies on meanwhile is the thing being hardened against, not a supported arrangement.
      - name: Log in to Docker Hub
        if: startsWith(matrix.test-file, 'fork.') && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Load Docker images
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: zstd -dc image-cache/images.tar.zst | docker load

      - name: Run e2e tests - ${{ matrix.test-file }}
        if: ${{ !contains(github.event.head_commit.message, '[skip_it]') && (inputs.run_fork_lane || !startsWith(matrix.test-file, 'fork.')) }}
        run: yarn e2e-single --filter="./testkit-js/*" --concurrency 1 --cache-dir ./turbo
        env:
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          MN_TEST_ENVIRONMENT: ${{ inputs.network }}
          MN_TEST_FILE: ${{ matrix.test-file }}

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-results-${{ inputs.testkit_docker_env || 'default' }}-${{ matrix.test-file }}
          path: testkit-js/testkit-js-e2e/reports/

  e2e_tests_reports:
    name: E2E Tests Reports
    runs-on: ubuntu-latest
    needs: e2e_tests
    # Run on success/failure AND cancelled/skipped so reviewers can still see a row
    # indicating why no test results exist (otherwise the absence is silent).
    if: always()
    steps:

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Download Test Results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          pattern: test-results-${{ inputs.testkit_docker_env || 'default' }}-*
          path: test-results

      - name: Generate Allure Report
        if: always()
        run: |
          mkdir -p allure-results
          find test-results -path '*/allure-results-*/*' -exec cp {} allure-results/ \;
          if [ "$(ls -A allure-results)" ]; then
            npx allure-commandline generate allure-results --clean -o allure-report
          else
            echo "No Allure results found"
          fi

      - name: Upload Allure Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        if: always() && needs.e2e_tests.result != 'skipped' && needs.e2e_tests.result != 'cancelled'
        with:
          name: allure-report-${{ inputs.testkit_docker_env || 'default' }}
          path: allure-report/
          if-no-files-found: error

      - name: Merge CTRF Results
        if: always()
        run: |
          mkdir ctrf-results
          find test-results -name "ctrf-*.json" -exec cp {} ctrf-results/ \;
          if [ "$(ls -A ctrf-results)" ]; then
            npx ctrf merge ctrf-results --output ./ctrf-report-merged.json
            # `npx ctrf merge` ignores --output and writes the merged file inside the input
            # directory (ctrf-results/ctrf-report-merged.json). Copy it to the workspace root
            # so the per-env summary step's `[ -f ./ctrf-report-merged.json ]` check finds it.
            if [ -f ctrf-results/ctrf-report-merged.json ] && [ ! -f ./ctrf-report-merged.json ]; then
              cp ctrf-results/ctrf-report-merged.json ./ctrf-report-merged.json
            fi
          else
            echo "No CTRF results found"
          fi

      - name: Write per-env step summary
        if: always()
        env:
          TESTKIT_ENV: ${{ inputs.testkit_docker_env || 'default' }}
          E2E_RESULT: ${{ needs.e2e_tests.result }}
        run: |
          set -euo pipefail
          {
            echo "### E2E Tests — \`${TESTKIT_ENV}\`"
            echo ""
            if [ "$E2E_RESULT" = "cancelled" ] || [ "$E2E_RESULT" = "skipped" ]; then
              echo ":rotating_light: E2E tests **${E2E_RESULT}** — no results to render."
            else
              CTRF_PATH=""
              if [ -f ./ctrf-report-merged.json ]; then
                CTRF_PATH="./ctrf-report-merged.json"
              fi
              ./.github/scripts/render-e2e-summary.sh "${TESTKIT_ENV}" "${CTRF_PATH}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Test Report
        if: always() && github.event_name != 'schedule'
        uses: ctrf-io/github-test-reporter@7974087018bf4857cf5a9d78723e152038c3fa31 # ratchet:ctrf-io/github-test-reporter@v1.3.0
        with:
          title: 'E2E Tests Results'
          report-path: 'ctrf-results/ctrf-report-merged.json'
          suite-folded-report: true
          pull-request: true
          pull-request-report: true
          overwrite-comment: true
          collapse-large-reports: true
          comment-tag: '${{ github.workflow }}-${{ github.job }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload CTRF Summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        if: always() && needs.e2e_tests.result != 'skipped' && needs.e2e_tests.result != 'cancelled'
        with:
          name: test-results-ctrf-summary-${{ inputs.testkit_docker_env || 'default' }}
          path: ctrf-results
          if-no-files-found: error

      - name: Publish Test Summary Results
        if: always()
        run: |
          mkdir junit-results
          find test-results -name "*.xml" -exec cp {} junit-results/ \;
          if [ "$(ls -A junit-results)" ]; then
            npm install -g junit-report-merger@9.0.4
            jrm junit-test-results.xml junit-results/*.xml
          else
            echo "No JUnit results found"
          fi

      - name: Upload JUnit Summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        if: always() && needs.e2e_tests.result != 'skipped' && needs.e2e_tests.result != 'cancelled'
        with:
          name: test-results-junit-summary-${{ inputs.testkit_docker_env || 'default' }}
          path: junit-test-results.xml
          if-no-files-found: error
