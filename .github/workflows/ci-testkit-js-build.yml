name: CI - TestKit.js (build)
#
# Reusable build/lint/unit-test job, intentionally separated from e2e so that
# nightly-e2e.yml can build once and fan e2e out across image-version envs.
# The wrapper (ci-testkit-js.yml) schedules build → (prerelease || e2e) in
# parallel via two separate `needs: build` jobs.

env:
  MIDNIGHTCI_PACKAGES_WRITE: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

permissions:
  actions: read
  contents: read
  issues: read
  id-token: write
  packages: write
  checks: write
  pull-requests: write

on:
  workflow_call:
    inputs:
      should_run:
        required: true
        type: string
      yarn_filter:
        type: string
        description: Yarn workspace filter applied to `yarn build` (e.g., `--filter="./testkit-js/*"`). Unit tests use a hardcoded filter.
        required: false
        default: '--filter="./testkit-js/*"'
      yarn_lint_paths:
        type: string
        description: Optional paths passed to `yarn lint` (e.g., ./packages).
        required: false
        default: './testkit-js'
      testkit_docker_env:
        type: string
        description: Docker image version set sourced from testkit-js/env/<testkit_docker_env>.env (qanet|preview|preprod|mainnet|devnet). Empty falls back to the .envrc default (devnet).
        required: false
        default: 'devnet'
    outputs:
      test-files:
        description: JSON array of e2e test filenames discovered in testkit-js-e2e/test.
        value: ${{ jobs.generate-test-matrix.outputs.test-files }}

concurrency:
  group: TK-JS-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only cancel superseded PR runs; queue push-to-main runs so a mid-flight
  # release (gated on this workflow in ci.yml) is never cancelled half-done.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: inputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Install direnv
        uses: ./.github/actions/install-direnv

      - name: Load environment from .envrc
        env:
          TESTKIT_DOCKER_ENV: ${{ inputs.testkit_docker_env }}
        run: |
          direnv allow .
          direnv export gha >> "$GITHUB_ENV"

      - name: Log in to GitHub Container registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # ratchet:docker/login-action@v4.5.2
        with:
          registry: 'https://ghcr.io'
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          registry-url: https://npm.pkg.github.com/
          scope: '@midnight-ntwrk'
          node-version-file: '.nvmrc'
          cache: 'yarn'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Configure yarn
        run: yarn config set 'npmScopes.midnight-ntwrk.npmAuthToken' ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Cache Turbo and Yarn dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            **/node_modules
            ~/.yarn
            .turbo
          key: turbo-testkit-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**/turbo.json') }}
          restore-keys: |
            turbo-testkit-${{ runner.os }}-

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Run build
        run: yarn build ${{ inputs.yarn_filter }} --cache-dir ./turbo
        env:
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Run linter
        run: yarn lint -- ${{ inputs.yarn_lint_paths }}

      - name: Run tests
        run: |
          yarn test --filter="./testkit-js/*" --cache-dir ./turbo
        env:
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Upload compiled contracts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: e2e-tests-contracts
          path: testkit-js/testkit-js-e2e/src/contract/compiled
          if-no-files-found: error

      - name: Upload packages dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: midnight-js-dist-testkit
          path: packages/*/dist/
          if-no-files-found: error

      - name: Upload testkit dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: testkit-dist
          path: testkit-js/*/dist/
          if-no-files-found: error

  generate-test-matrix:
    runs-on: ubuntu-latest
    needs: ci
    if: inputs.should_run == 'true'
    outputs:
      test-files: ${{ steps.generate-matrix.outputs.test-files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Generate test matrix
        id: generate-matrix
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          FILES=$(cd testkit-js/testkit-js-e2e/test && ls *.test.ts)
          if [ -z "$FILES" ]; then
            echo "::error::No e2e test files discovered in testkit-js/testkit-js-e2e/test"
            exit 1
          fi
          # Order longest-first from recent run history so the slowest files start
          # in the first max-parallel wave (LPT). Fall back to alphabetical if the
          # ordering script fails or returns anything other than the same file set.
          ORDERED=$(printf '%s\n' "$FILES" | bash "$GITHUB_WORKSPACE/.github/scripts/order-e2e-matrix.sh" 2>/dev/null || true)
          if [ -z "$ORDERED" ] || [ "$(printf '%s\n' "$ORDERED" | sort)" != "$(printf '%s\n' "$FILES" | sort)" ]; then
            echo "::warning::e2e matrix ordering unavailable; using alphabetical order"
            ORDERED=$(printf '%s\n' "$FILES" | sort)
          fi
          TEST_FILES=$(printf '%s\n' "$ORDERED" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "test-files=$TEST_FILES" >> "$GITHUB_OUTPUT"
          echo "Generated test matrix: $TEST_FILES"
