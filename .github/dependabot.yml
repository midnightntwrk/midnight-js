version: 2

registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

updates:
  - package-ecosystem: "github-actions"
    labels:
      - "bot:github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

#  - package-ecosystem: "cargo"
#    directory: "/"
#    registries: "*"
#    schedule:
#      interval: "daily"
#    cooldown:
#      default-days: 7

  - package-ecosystem: "npm"
    labels:
      - "bot:dependencies"
    directory: "/"
    registries:
      - npm-github
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

