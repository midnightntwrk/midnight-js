name: 'Setup build environment'
description: >-
  Shared bootstrap for CI jobs: direnv-loaded .envrc, optional GHCR login,
  Node.js with the GitHub Packages registry, yarn auth, the node_modules
  cache and the turbo build cache. Extracted to remove the setup block that
  was duplicated across ~8 jobs.
  The caller must run actions/checkout BEFORE this action — a local composite
  action cannot check out the repo it is loaded from.

inputs:
  node-auth-token:
    description: Token for the @midnight-ntwrk GitHub Packages registry (npm auth).
    required: true
  docker-login:
    description: "Set 'true' to log in to ghcr.io (build/e2e jobs that pull images)."
    required: false
    default: 'false'
  docker-password:
    description: Password for the ghcr.io login (only read when docker-login is 'true').
    required: false
    default: ''
  cache-key-prefix:
    description: "Prefix for the turbo build cache key; a job that builds a different set of packages uses its own prefix."
    required: false
    default: 'turbo'
  turbo-cache:
    description: "Set 'false' to neither restore nor save the turbo build cache: for jobs that build nothing, and for publish jobs, which build from source."
    required: false
    default: 'true'
  testkit-docker-env:
    description: Value exported as TESTKIT_DOCKER_ENV before loading .envrc (empty falls back to the .envrc default).
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install direnv
      uses: ./.github/actions/install-direnv

    - name: Load environment from .envrc
      shell: bash
      env:
        TESTKIT_DOCKER_ENV: ${{ inputs.testkit-docker-env }}
      run: |
        direnv allow .
        direnv export gha >> "$GITHUB_ENV"

    - name: Log in to GitHub Container registry
      if: inputs.docker-login == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4.6.0
      with:
        registry: 'https://ghcr.io'
        username: MidnightCI
        password: ${{ inputs.docker-password }}

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
      with:
        registry-url: https://npm.pkg.github.com/
        scope: '@midnight-ntwrk'
        node-version-file: '.nvmrc'
        cache: 'yarn'
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token }}

    - name: Configure yarn
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token }}
      run: yarn config set 'npmScopes.midnight-ntwrk.npmAuthToken' "$NODE_AUTH_TOKEN"

    - name: Cache node_modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
      with:
        path: '**/node_modules'
        key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc') }}-

    - name: Cache turbo build output
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
      with:
        path: .turbo/cache
        key: ${{ inputs.cache-key-prefix }}-build-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-build-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-

    - name: Drop turbo build entries older than a week
      if: inputs.turbo-cache == 'true'
      shell: bash
      run: if [ -d .turbo/cache ]; then find .turbo/cache -type f -mtime +7 -delete; fi
